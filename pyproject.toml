[project]
name = "nyc-taxi-revenue-data-pipeline"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.5",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14",
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
green_taxi = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated configuration and helper behaviour",
    "integration: components working together with real local files or processes",
    "data: dataset structure, content identity, and file publication checks",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
root = ["."]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]
