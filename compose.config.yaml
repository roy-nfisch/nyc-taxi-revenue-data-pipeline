# Read the existing defaults directly; TAXI_CONFIG_FILE optionally selects another file.
x-config-file: &config-file
  type: bind
  source: ${TAXI_CONFIG_FILE:-./src/green_taxi/defaults.json}
  target: /run-config/run.json
  read_only: true
  bind:
    create_host_path: false

services:
  pipeline:
    command: [python, -m, green_taxi, --run, --config, /run-config/run.json, --data-dir, /data]
    volumes:
      - *config-file
  flow:
    command: [python, -m, green_taxi.flow, --config, /run-config/run.json, --data-dir, /data]
    volumes:
      - *config-file
