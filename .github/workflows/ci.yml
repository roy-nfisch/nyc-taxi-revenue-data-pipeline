name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv build

  tests:
    name: ${{ matrix.category }} tests
    needs: checks
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: unit
            workers: 0
          - category: integration
            workers: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - run: uv python install
      - run: uv sync --locked
      - name: Run selected category
        run: uv run --locked pytest tests/ -m "${{ matrix.category }}" -n ${{ matrix.workers }} --dist loadfile

  docker:
    name: Docker smoke tests
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - run: uv python install
      - run: uv sync --locked
      - run: docker compose --profile manual config --quiet
      - run: docker compose build
        env:
          BUILD_REVISION: ${{ github.sha }}
          BUILD_DIRTY: "false"
      - run: uv run --locked pytest tests/docker/ -q
        env:
          GREEN_TAXI_DOCKER_TESTS: "1"
