name: Publish pipeline image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Pipeline to publish (separate ETL and ELT packages)"
        required: true
        default: etl
        type: choice
        options: [etl, elt]
      version:
        description: "Release tag, e.g. 2026.11.05 or 2026.11.05.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publishing
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      image_id: ${{ steps.archive.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manual release request
        id: release
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ inputs.variant }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Publish only from main.'
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[1-9][0-9]*)?$ || ${#VERSION} -gt 128 ]]; then
            echo '::error::Use YYYY.MM.DD or YYYY.MM.DD.N, such as 2026.11.05.1.'
            exit 1
          fi
          python3 -c 'import datetime, os; datetime.date(*map(int, os.environ["VERSION"].split(".")[:3]))'
          image=$(python3 -c 'import os; print("ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower())')
          case "$VARIANT" in
            etl) target=etl; install_elt=false; local_tag=green-taxi:local ;;
            elt) image="$image-elt"; target=elt; install_elt=true; local_tag=green-taxi-elt:local ;;
            *) echo '::error::Choose etl or elt.'; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "install_elt=$install_elt" >> "$GITHUB_OUTPUT"
          echo "local_tag=$local_tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Install locked test dependencies
        run: |
          uv python install
          uv sync --locked --extra elt
      - name: Check Python code and package
        run: |
          uv run --locked ruff check src tests .github/scripts
          uv run --locked ruff format --check src tests .github/scripts
          uv build
      - name: Validate Compose and build image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TARGET: ${{ steps.release.outputs.target }}
          INSTALL_ELT: ${{ steps.release.outputs.install_elt }}
        run: |
          docker compose --profile manual config --quiet
          docker compose build
          docker build --target "$TARGET" --build-arg "INSTALL_ELT=$INSTALL_ELT" -t "$IMAGE:test" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" --build-arg BUILD_DIRTY=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Build ELT image
        env:
          BUILD_REVISION: ${{ github.sha }}
          BUILD_DIRTY: "false"
        run: docker compose -f compose.yaml -f compose.elt.yaml build elt-tools
      - name: Run all tests against the built image
        env:
          GREEN_TAXI_DOCKER_TESTS: "1"
          IMAGE: ${{ steps.release.outputs.image }}
          LOCAL_TAG: ${{ steps.release.outputs.local_tag }}
        run: |
          docker tag "$IMAGE:test" "$LOCAL_TAG"
          uv run --locked --extra elt pytest tests/ -n 2 --dist loadfile
      - name: Save the tested image
        id: archive
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:test")" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE:test"
      - name: Transfer tested image to publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      VERSION: ${{ needs.verify.outputs.version }}
      TESTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load and confirm the tested image
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE:test")" == "$TESTED_IMAGE_ID" ]]
          docker tag "$IMAGE:test" "$IMAGE:$VERSION"
          docker tag "$IMAGE:test" "$IMAGE:sha-$GITHUB_SHA"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Reject an existing version tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_image_version.py
      - name: Publish version and commit tags
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
      - name: Pull the published digest
        id: published
        run: |
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          [[ "$reference" == "$IMAGE@sha256:"* ]]
          docker pull "$reference"
          [[ "$(docker image inspect --format '{{.Id}}' "$reference")" == "$TESTED_IMAGE_ID" ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          printf 'Published and pulled: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - name: Check published pipeline with tiny staged data
        env:
          REFERENCE: ${{ steps.published.outputs.reference }}
          GREEN_TAXI_DOCKER_TESTS: "1"
          VARIANT: ${{ inputs.variant }}
        run: |
          if [[ "$VARIANT" == elt ]]; then
            local_tag=green-taxi-elt:local
            test_file=tests/docker/test_elt.py
          else
            local_tag=green-taxi:local
            test_file=tests/docker/test_container.py
          fi
          docker tag "$REFERENCE" "$local_tag"
          uv python install
          uv sync --locked
          uv run --locked pytest "$test_file"
      - name: Update latest after verification
        env:
          REFERENCE: ${{ steps.published.outputs.reference }}
        run: |
          docker tag "$REFERENCE" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          printf 'Verified tags: %s, sha-%s, latest\n' "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
