# Explicit ELT services; default ETL services are unchanged.
services:
  elt:
    extends:
      service: elt-tools
    command: [python, -m, green_taxi.elt, --data-dir, /data]

  elt-flow:
    extends:
      service: elt-tools
    command: [python, -m, green_taxi.elt.flow, --data-dir, /data]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
    depends_on:
      prefect:
        condition: service_healthy

  elt-tools:
    init: true
    profiles: [manual]
    image: ${TAXI_ELT_IMAGE:-green-taxi-elt:local}
    build:
      context: .
      args:
        INSTALL_ELT: "true"
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        BUILD_DIRTY: ${BUILD_DIRTY:-unknown}
    networks: [taxi-network]
    volumes:
      - taxi-data:/data
    command:
      - python
      - -c
      - >-
        from importlib.resources import files;
        import duckdb;
        sql = files('green_taxi.elt').joinpath('sql/schema.sql').read_text();
        print('ELT preparation: DuckDB', duckdb.__version__);
        print('Registry SQL packaged:', bool(sql));
        print('No ELT pipeline or database was started.')
